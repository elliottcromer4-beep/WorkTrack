name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The UI smoke tests need a display; on Linux they skip without one, so
      # give them a virtual framebuffer rather than losing the coverage.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m pytest

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean WorkTrack.spec

      - uses: actions/upload-artifact@v4
        with:
          name: WorkTrack-exe
          path: dist/WorkTrack.exe
