[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worktrack"
version = "1.1.1"
description = "Time tracking and timesheet reporting for professional services."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Elliott Cromer" }]
keywords = ["time tracking", "timesheet", "invoicing", "productivity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
    "pystray>=0.19.4",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyMuPDF>=1.24",
    "ruff>=0.5",
]

[project.gui-scripts]
worktrack = "main:main"

[tool.setuptools]
packages = ["src", "src.ui", "src.exports"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",    # customtkinter takes widget factories as defaults
    "SIM105",  # explicit try/except reads better than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
